<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyPulse - Academic Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-indigo-400">StudyPulse Tracker</h1>
        
        <!-- Timer Section -->
        <div class="text-center mb-8">
            <div id="timer" class="text-6xl font-mono font-bold mb-4">25:00</div>
            <div class="space-x-2">
                <button onclick="startTimer()" class="bg-indigo-600 px-4 py-2 rounded-lg font-medium hover:bg-indigo-500 cursor-pointer transition">Start</button>
                <button onclick="resetTimer()" class="bg-slate-700 px-4 py-2 rounded-lg font-medium hover:bg-slate-600 cursor-pointer transition">Reset</button>
            </div>
        </div>

        <!-- Task Section -->
        <div>
            <h2 class="text-lg font-semibold mb-3">Study Goals</h2>
            <div class="flex gap-2 mb-4">
                <input type="text" id="taskInput" placeholder="Add a new topic..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                <button onclick="addTask()" class="bg-emerald-600 px-4 py-2 rounded-lg font-medium hover:bg-emerald-500 text-sm cursor-pointer transition">Add</button>
            </div>
            <ul id="taskList" class="space-y-2 max-h-40 overflow-y-auto"></ul>
        </div>
    </div>

    <script>
        // Simple Timer Logic
        let timeLeft = 1500;
        let timerId = null;

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const seconds = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${minutes}:${seconds}`;
        }

        function startTimer() {
            if (timerId !== null) return;
            timerId = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    clearInterval(timerId);
                    timerId = null;
                    alert('Focus session complete!');
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerId);
            timerId = null;
            timeLeft = 1500;
            updateDisplay();
        }

        // Simple Task Logic
        function addTask() {
            const input = document.getElementById('taskInput');
            if (!input.value.trim()) return;
            const li = document.createElement('li');
            li.className = "bg-slate-900 p-2.5 rounded-lg border border-slate-700 flex justify-between items-center text-sm";
            li.innerHTML = `<span>${input.value}</span> <button onclick="this.parentElement.remove()" class="text-rose-400 hover:text-rose-300 text-xs cursor-pointer">Delete</button>`;
            document.getElementById('taskList').appendChild(li);
            input.value = '';
        }
    </script>
</body>
</html>
